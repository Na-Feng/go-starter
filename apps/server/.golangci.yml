run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - forbidigo
    - bodyclose
    - sqlclosecheck
    - gochecknoinits
    - contextcheck
    - nilerr
    - errorlint

linters-settings:
  depguard:
    rules:
      kernel-and-stdlib-hygiene:
        files:
          - "**/internal/**"
        deny:
          - pkg: "io/ioutil"
            desc: "已废弃：请使用标准库 io 或 os 替代"
          - pkg: "log$"
            desc: "禁止使用标准库 log：请统一通过 internal/kernel/logger 使用 log/slog"
      isolate-sample:
        files:
          - "**/internal/modules/sample/**"
        deny:
          - pkg: "go-starter/internal/modules/iam"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"
          - pkg: "go-starter/internal/modules/files"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"
      isolate-iam:
        files:
          - "**/internal/modules/iam/**"
        deny:
          - pkg: "go-starter/internal/modules/sample"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"
          - pkg: "go-starter/internal/modules/files"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"
      isolate-files:
        files:
          - "**/internal/modules/files/**"
        deny:
          - pkg: "go-starter/internal/modules/sample"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"
          - pkg: "go-starter/internal/modules/iam"
            desc: "禁止跨模块直接引用：请在调用方定义最小接口，由 cmd/server/main.go 注入"

  forbidigo:
    forbid:
      - p: '^fmt\.Print.*$'
        msg: "禁止使用 fmt.Print*，请使用 slog 结构化日志"
      - p: '^http\.(Get|Post|Head|PostForm)$'
        msg: "禁止使用无超时的默认 http.Get/Post，请显式构造带 Timeout 的 http.Client"
      - p: '^os\.Exit$'
        msg: "仅允许在 cmd/ 入口调用 os.Exit，业务层请返回 *errs.AppError"
      - p: '^panic$'
        msg: "禁止在业务代码调用 panic，请返回 *errs.AppError"
      - p: '^time\.Sleep$'
        msg: "禁止使用 time.Sleep 硬等，请改用 select <-ctx.Done()"
      - p: '^context\.(Background|TODO)$'
        msg: "禁止在业务层新建根 Context，请透传上游传入的 ctx"

issues:
  exclude-rules:
    - path: ^cmd/
      linters:
        - forbidigo
      text: "(os\.Exit|context\.Background)"
    - path: ^internal/kernel/
      linters:
        - forbidigo
      text: "(context\.Background|panic)"
    - path: _test\.go$
      linters:
        - forbidigo
      text: "context\.Background"
